<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Checker</title>
<style>
  :root {
    --bg: #f4f7f9;
    --ink: #14202b;
    --muted: #5b6b78;
    --pipe: #b8c6d1;
    --weak: #c2410c;
    --medium: #b7791f;
    --strong: #15803d;
    --pass: #15803d;
    --fail: #c2410c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field { display: flex; gap: 8px; }
  input[type="text"], input[type="password"] {
    flex: 1;
    font: 1.1rem ui-monospace, Consolas, monospace;
    padding: 12px 14px;
    border: 2px solid var(--pipe);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  input:focus-visible, button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  button {
    font: inherit;
    padding: 0 14px;
    border: 2px solid var(--pipe);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  .meter { margin: 22px 0 8px; height: 14px; background: #e3e9ee; border-radius: 7px; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--weak); transition: width .25s, background .25s; }
  .verdict { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 28px; }

  /* The pipe: a vertical line with one station per filter */
  .pipe { position: relative; margin: 0; padding: 0 0 0 34px; list-style: none; }
  .pipe::before {
    content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px;
    width: 6px; background: var(--pipe); border-radius: 3px;
  }
  .pipe li { position: relative; padding: 0 0 18px; }
  .pipe li::before {
    content: ""; position: absolute; left: -33px; top: 3px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 4px solid var(--pass);
  }
  .pipe li.fail::before { border-color: var(--fail); }
  .name { font-weight: 600; }
  .msg { color: var(--muted); font-size: .95rem; }
  .pts { float: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .pts.plus { color: var(--pass); }
  .pts.zero, .pts.minus { color: var(--fail); }
  .running { color: var(--muted); font-size: .85rem; }
  .empty { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .meter > div { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Password Strength Checker</h1>
  <p class="sub">Your password travels through six filters. Each one checks one thing and adds to the score.</p>

  <label for="pw">Password to test</label>
  <div class="field">
    <input id="pw" type="password" autocomplete="off" spellcheck="false" placeholder="Start typing">
    <button id="toggle" type="button" aria-pressed="false">Show</button>
  </div>

  <div class="meter" aria-hidden="true"><div id="bar"></div></div>
  <div class="verdict"><span id="strength">Type a password to begin</span><span id="score"></span></div>

  <ol class="pipe" id="steps"></ol>
</main>

<script>
  const pw = document.getElementById("pw");
  const toggle = document.getElementById("toggle");
  const bar = document.getElementById("bar");
  const strengthEl = document.getElementById("strength");
  const scoreEl = document.getElementById("score");
  const stepsEl = document.getElementById("steps");

  const colors = { Weak: "var(--weak)", Medium: "var(--medium)", Strong: "var(--strong)" };

  toggle.addEventListener("click", () => {
    const show = pw.type === "password";
    pw.type = show ? "text" : "password";
    toggle.textContent = show ? "Hide" : "Show";
    toggle.setAttribute("aria-pressed", String(show));
  });

  let timer;
  pw.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(check, 150);
  });

  async function check() {
    const res = await fetch("/api/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw.value })
    });
    render(await res.json());
  }

  function render(data) {
    bar.style.width = Math.min(data.score, 100) + "%";
    bar.style.background = colors[data.strength];
    strengthEl.textContent = pw.value ? data.strength : "Type a password to begin";
    scoreEl.textContent = pw.value ? data.score + " / 100" : "";

    stepsEl.replaceChildren();
    data.steps.forEach(s => {
      const li = document.createElement("li");
      if (!s.passed) li.className = "fail";

      const pts = document.createElement("span");
      pts.className = "pts " + (s.points > 0 ? "plus" : s.points < 0 ? "minus" : "zero");
      pts.textContent = (s.points > 0 ? "+" : "") + s.points;

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = s.filter;
      name.prepend(pts);

      const msg = document.createElement("div");
      msg.className = "msg";
      msg.textContent = s.message;

      const run = document.createElement("div");
      run.className = "running";
      run.textContent = "Score after this filter: " + s.runningScore;

      li.append(name, msg, run);
      stepsEl.append(li);
    });
  }

  check();
</script>
</body>
</html>
